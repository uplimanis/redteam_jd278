[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uplimanis-redteam_jd278"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别红队与内容安全工程师·流水线并行气泡比例上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "uplimanis" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://uplimanis.github.io"
Repository = "https://github.com/uplimanis/redteam_jd278"
Issues = "https://github.com/uplimanis/redteam_jd278/issues"

[project.scripts]
redteam_jd278 = "redteam_jd278:main"

[tool.setuptools]
py-modules = ["redteam_jd278"]
